<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rubble</title>
<meta name="description" content="Rubble">
<meta name="theme-color" content="#0b0b10">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rubble">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="stylesheet" href="styles.css">

<div id="jeu">
  <canvas id="ecran" aria-label="Rubble"></canvas>
  <!-- la manette tactile (moteur/entrees.js) : n'apparaît que sur un écran tactile -->
  <div class="manette">
    <div class="croix" id="croix" aria-label="Directional pad">
      <div class="croix-dessin"><span class="pommeau"></span></div>
    </div>
    <div class="actions" id="actions">
      <span class="rond" data-k="b" aria-label="B (C key)"><b>C</b></span>
      <span class="rond" data-k="a" aria-label="A (X key)"><b>X</b></span>
    </div>
  </div>
  <div class="tourner" role="alert">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="15" y="6" width="18" height="30" rx="3"/><path d="M8 40a18 18 0 0 0 30 4M38 44l1-6-6 1"/></svg>
    <p>Rotate your device</p>
  </div>
</div>

<script type="module" src="jeu.js"></script>
